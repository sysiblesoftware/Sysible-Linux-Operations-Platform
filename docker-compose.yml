# Sysible Linux Operations Platform (SLOP) — the front door: gateway + IdP.
#
# This brings up the SLOP front door, which is TWO services:
#   * idp      — the identity provider: the one user store, the login page, and
#                where every account + password (for all three apps) is managed.
#   * gateway  — Caddy: terminates TLS, serves the portal, and enforces single
#                sign-on for the three apps via forward_auth to the IdP.
#
# The three apps — Controller, SLEP, Connect — run as their OWN container stacks
# (install them with `install-sysible`, or manage with `sysiblectl`); the gateway
# proxies to them on the host ports they publish (8800 / 8810 / 8700). For SSO to
# reach INTO the apps, each app must run with the SAME SYSIBLE_SSO_SHARED_SECRET
# and its trust flag on — `install.sh` wires that automatically.
#
#   1. Bring up the apps + door together:   sudo ./install.sh
#      (or bring up the apps yourself, then `docker compose up -d --build` here).
#   2. Open  https://<this server's IP>/  and sign in. No domain to set, no DNS —
#      everything is ONE origin addressed by path (/controller /slep /connect) on
#      whatever IP this host has. (Accept the one-time self-signed cert warning.)
#
# See .env.example for the knobs and docs/SSO.md for the SSO contract.
#
# SYSIBLE_SLOP_REV: every built image takes the commit it was built from as a
# build arg, and each console prints it in its footer. A SLOP console is
# server-rendered — the whole page comes out of the container — so a stale image
# and a current one look identical from outside, and "is this my browser, my
# server, or your code?" had no answer on screen.
#
# sysiblectl and the updater set it from `git rev-parse --short HEAD`; install.sh
# builds through sysiblectl, so it inherits it. Left empty by a bare
# `docker compose up`, and a console with no revision says "version unknown"
# rather than inventing one.
services:
  idp:
    build:
      context: ./idp
      args:
        SYSIBLE_REV: "${SYSIBLE_SLOP_REV:-}"   # see the header
    image: sysible-slop-idp
    container_name: sysible-slop-idp
    restart: unless-stopped
    environment:
      # No domain to configure — the IdP is same-origin behind the gateway and its
      # session cookie is always host-only. First-run bootstrap only: left empty,
      # the documented default admin / sysible is used (public — change it at
      # /account). SLOP_ADMIN_PASSWORD=random generates one into
      # /data/initial-password (0600, never the log) instead, which is what to use
      # for anything exposed.
      SLOP_ADMIN_USER: ${SLOP_ADMIN_USER:-admin}
      SLOP_ADMIN_PASSWORD: ${SLOP_ADMIN_PASSWORD:-}
      # Administration -> Software updates talks to the updater sidecar over the
      # internal network, proving itself with the platform shared secret. The IdP
      # deliberately has NO Docker socket of its own.
      SLOP_UPDATER_UPSTREAM: ${SLOP_UPDATER_UPSTREAM:-updater:8080}
      # The updater's OWN secret. It holds the host's Docker socket, so it is not
      # authenticated with the platform-wide value every other service carries —
      # otherwise a flaw in any of them is one hop from a root shell. Only these
      # two services get it. Empty falls back to the shared secret (an install
      # that predates the split), and the updater says so on every start.
      SYSIBLE_UPDATER_SECRET: ${SYSIBLE_UPDATER_SECRET:-}
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
    volumes:
      - slop-idp-data:/data     # the user store (SQLite) — persist across restarts
    expose:
      - "8080"                  # internal only; the gateway is the sole front door

  gateway:
    image: caddy:2-alpine
    container_name: sysible-slop-gateway
    restart: unless-stopped
    # NO depends_on. It bought ordering and cost the front door: with a plain
    # depends_on, a module that fails to START (Flashback cannot bind its
    # loopback port because something else holds it, say) stops compose bringing
    # the gateway up at all — so a broken side feature takes down the portal AND
    # the sign-in page, with nothing on :443 to explain why.
    #
    # Caddy resolves every upstream at request time, so it needs none of them to
    # exist when it starts. A module that is down 502s on its own path and
    # nothing else is affected, which is the behaviour we actually want.
    ports:
      - "80:80"     # HTTP → redirected to HTTPS by Caddy
      - "443:443"   # the single front door
    environment:
      # No domain — the gateway answers on 443 for whatever IP this host has and
      # mints its own self-signed cert (see gateway/Caddyfile).
      # The IdP the gateway asks "is this request signed in?" (forward_auth).
      SLOP_IDP_UPSTREAM: ${SLOP_IDP_UPSTREAM:-idp:8080}
      # The shared secret the gateway stamps on every proxied request so the apps
      # can prove it came through the gateway. MUST match each app's
      # SYSIBLE_SSO_SHARED_SECRET, or the apps fail closed and show their own login.
      # install.sh generates one into .env; set it yourself for a manual bring-up.
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
      # See the baseline service for why this is not the platform-wide secret.
      SYSIBLE_BASELINE_GATEWAY_SECRET: ${SYSIBLE_BASELINE_GATEWAY_SECRET:-${SYSIBLE_SSO_SHARED_SECRET:-}}
      # Where the apps actually listen (host:port). Defaults assume they publish on
      # this host; override if they run elsewhere or on a shared docker network.
      SLOP_CONTROLLER_UPSTREAM: ${SLOP_CONTROLLER_UPSTREAM:-host.docker.internal:8800}
      SLOP_SLEP_UPSTREAM: ${SLOP_SLEP_UPSTREAM:-host.docker.internal:8810}
      SLOP_CONNECT_UPSTREAM: ${SLOP_CONNECT_UPSTREAM:-host.docker.internal:8700}
      # Flashback (backup & restore) is baked into THIS stack (below), so the
      # gateway reaches it by service name on the internal network — no host port.
      SLOP_FLASHBACK_UPSTREAM: ${SLOP_FLASHBACK_UPSTREAM:-flashback:8080}
      SLOP_BASELINE_UPSTREAM: ${SLOP_BASELINE_UPSTREAM:-baseline:8080}
      # Visualizer (the activity & log console) is baked into THIS stack too.
      SLOP_VISUALIZER_UPSTREAM: ${SLOP_VISUALIZER_UPSTREAM:-visualizer:8080}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal:/srv/portal:ro
      - slop-caddy-data:/data      # issued certs + the internal CA (persist across restarts)
      - slop-caddy-config:/config
    extra_hosts:
      # Lets the container reach apps published on the host (Linux needs this).
      - "host.docker.internal:host-gateway"

  # Flashback — backup & restore — is a SLOP-native module (like the
  # IdP), so it's built and run here as part of the front door rather than as a
  # separate stack. It's expose-only (no host port): the gateway proxies to it at
  # flashback:8080 on this compose's internal network, and it trusts the gateway's
  # asserted identity via the same shared secret.
  #
  # BRIEFLY RENAMED TO `baseline`, AND RENAMED BACK. A stack brought up during
  # those two days is running a `sysible-baseline` container built from this
  # service; it is now an orphan, and it still holds the agent port on the
  # docker bridge, so `sysible-flashback` cannot bind it and dies on startup.
  # `sysible_ctl slop update` removes it first; a hand-run `docker compose up -d`
  # needs --remove-orphans.
  #
  # `baseline` is NOT a free name to reuse: it belongs to Sysible Baseline, the
  # Salt-driven config manager, which is a different service in this same file.
  flashback:
    build:
      context: ./flashback
      args:
        SYSIBLE_REV: "${SYSIBLE_SLOP_REV:-}"   # see the header
    image: sysible-flashback
    container_name: sysible-flashback
    restart: unless-stopped
    environment:
      # Always behind the gateway here, so trust its asserted identity (guarded by
      # the shared secret) and never expose an own login.
      SYSIBLE_FLASHBACK_TRUST_GATEWAY_AUTH: "1"
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
      # Bearer token host agents present to the ingest/restore endpoints. Empty =
      # open (dev only); set it and hand the same value to the agents.
      SYSIBLE_FLASHBACK_AGENT_TOKEN: ${SYSIBLE_FLASHBACK_AGENT_TOKEN:-}
      SYSIBLE_FLASHBACK_KEEP: ${SYSIBLE_FLASHBACK_KEEP:-50}
      # Flashback reads the Controller's enrolled-host list so the console can
      # show hosts that have not captured yet. Same var the Visualizer uses.
      SLOP_CONTROLLER_UPSTREAM: ${SLOP_CONTROLLER_UPSTREAM:-host.docker.internal:8800}
    volumes:
      # flashback-data KEPT ITS NAME THROUGH THE RENAME AND BACK. This volume is
      # the product: every version of every config file on every host, and the
      # only thing in the stack that cannot be rebuilt from anything else. A
      # renamed volume is not a migrated volume — compose would create a fresh
      # empty one and the console would come up pristine on a fleet with years
      # of captures, which reads exactly like "Flashback deleted everything".
      - flashback-data:/data       # the version store (SQLite) — persist across restarts
    expose:
      - "8080"                     # the gateway's front door for the browser console
    ports:
      # The AGENT api (snapshot ingest + restore delivery) has to be reachable by
      # the Controller. The Controller is the only client — host agents never talk
      # to Flashback directly, so the bearer token lives in one place instead of on
      # every host, and the Controller stamps host_id from the agent it just
      # authenticated (a host cannot name another).
      #
      # THE BIND ADDRESS IS NOT 127.0.0.1 BY DEFAULT, and that is the whole point.
      # This was hardcoded to loopback "because the Controller runs on the host" —
      # it does not. The Controller is a container, and it reaches back through
      # host.docker.internal, which resolves to the docker bridge gateway
      # (172.17.0.1), a DIFFERENT interface from the host's loopback. Nothing was
      # listening there, so every snapshot and every restore poll was refused, and
      # a fleet of perfectly healthy agents captured precisely nothing — with the
      # console showing them all politely asking, forever.
      #
      # host-gateway is still not a public surface: it is reachable from containers
      # on this host and from the host itself, not from the network, which is the
      # property loopback was chosen for. Override with SYSIBLE_FLASHBACK_AGENT_BIND
      # (127.0.0.1 restores the old behaviour, for a Controller genuinely on the
      # host; 0.0.0.0 exposes it and should not be needed).
      - "${SYSIBLE_FLASHBACK_AGENT_BIND:-172.17.0.1}:${SYSIBLE_FLASHBACK_AGENT_PORT:-8770}:8080"
    extra_hosts:
      # Reach the Controller, which is published on the HOST — without this
      # host.docker.internal does not resolve on Linux and the host list fails
      # with ConnectError, exactly as the Visualizer needed the same mapping.
      - "host.docker.internal:host-gateway"

  # Baseline — desired-state configuration. A SLOP-native module like Flashback
  # and the Visualizer: expose-only, reached by the gateway at baseline:8080.
  #
  # NO HOST PORT, and no Salt in this image. Baseline is MASTERLESS: it composes
  # a `salt-call --local` command and the Controller runs it on the host through
  # the agent channel it already has. Nothing here ever evaluates a state, so a
  # salt install would add a large dependency tree and a C toolchain for no
  # capability. See baseline/backend/salt.py for why masterless.
  #
  # Its volume is its OWN. baseline-data holds declared states and run history;
  # flashback-data holds what hosts actually look like. The declaration and the
  # observation must be able to disagree, so they are never the same store.
  baseline:
    build:
      context: ./baseline
      args:
        SYSIBLE_REV: "${SYSIBLE_SLOP_REV:-}"   # see the header
    image: sysible-baseline
    container_name: sysible-baseline
    restart: unless-stopped
    environment:
      SYSIBLE_BASELINE_TRUST_GATEWAY_AUTH: "1"
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
      # Baseline's OWN gateway secret, falling back to the platform-wide one so an
      # install that has not re-run install.sh keeps working unchanged. Held by the
      # gateway (which stamps it into X-Sysible-Auth for /baseline only), Baseline
      # (which checks it) and the Visualizer (which reads Baseline's feeds directly)
      # — deliberately NOT by every service on the stack. This container publishes
      # its :8080 on the docker bridge so the Controller can reach the agent API, and
      # that port serves the browser console too; a Baseline state runs as root on
      # every host it is assigned to. See baseline/backend/identity.py.
      SYSIBLE_BASELINE_GATEWAY_SECRET: ${SYSIBLE_BASELINE_GATEWAY_SECRET:-${SYSIBLE_SSO_SHARED_SECRET:-}}
      # The Controller presents this to read desired state and post results.
      # Empty = Baseline refuses both, which is the right default for a service
      # that describes a whole fleet's configuration.
      SYSIBLE_BASELINE_AGENT_TOKEN: ${SYSIBLE_BASELINE_AGENT_TOKEN:-}
      SYSIBLE_BASELINE_KEEP: ${SYSIBLE_BASELINE_KEEP:-50}
      SLOP_CONTROLLER_UPSTREAM: ${SLOP_CONTROLLER_UPSTREAM:-host.docker.internal:8800}
    volumes:
      - baseline-data:/data
    expose:
      - "8080"                     # the gateway's front door for the browser console
    ports:
      # The CONTROLLER api (desired state out, results back) has to be reachable
      # by the Controller, which is a container in a DIFFERENT compose project —
      # `baseline:8080` does not resolve for it. Same bind as Flashback's agent
      # port and for the same reason: the docker bridge gateway is reachable
      # from containers on this host and from the host, not from the network.
      - "${SYSIBLE_BASELINE_AGENT_BIND:-172.17.0.1}:${SYSIBLE_BASELINE_AGENT_PORT:-8771}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Visualizer — the platform-wide activity & log console. Like the IdP and
  # Flashback it is a SLOP-native service in this stack: expose-only (no host
  # port), reached by the gateway at visualizer:8080. It is STATELESS and
  # READ-ONLY — no volume — because it stores nothing: every record it shows is
  # fetched live from the app that owns it, using the caller's own forwarded
  # identity so each app applies its own role rules.
  visualizer:
    build:
      context: ./visualizer
      args:
        SYSIBLE_REV: "${SYSIBLE_SLOP_REV:-}"   # see the header
    image: sysible-visualizer
    container_name: sysible-visualizer
    restart: unless-stopped
    environment:
      SYSIBLE_VISUALIZER_TRUST_GATEWAY_AUTH: "1"
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
      # See the baseline service for why this is not the platform-wide secret.
      SYSIBLE_BASELINE_GATEWAY_SECRET: ${SYSIBLE_BASELINE_GATEWAY_SECRET:-${SYSIBLE_SSO_SHARED_SECRET:-}}
      # Where to read each app's activity/audit API. Same values the gateway uses.
      SLOP_CONTROLLER_UPSTREAM: ${SLOP_CONTROLLER_UPSTREAM:-host.docker.internal:8800}
      SLOP_SLEP_UPSTREAM: ${SLOP_SLEP_UPSTREAM:-host.docker.internal:8810}
      SLOP_CONNECT_UPSTREAM: ${SLOP_CONNECT_UPSTREAM:-host.docker.internal:8700}
      SLOP_FLASHBACK_UPSTREAM: ${SLOP_FLASHBACK_UPSTREAM:-flashback:8080}
      SLOP_BASELINE_UPSTREAM: ${SLOP_BASELINE_UPSTREAM:-baseline:8080}
    expose:
      - "8080"                     # internal only; the gateway is the sole front door
    extra_hosts:
      # Reach the three apps published on the host (Linux needs this).
      - "host.docker.internal:host-gateway"

  # The updater — SLOP Administration's "Update now" button. It is the ONLY
  # component given the host's Docker socket, which is root-equivalent on the
  # host. That is why it is a separate service rather than a capability of the
  # IdP: the IdP terminates browser sessions and is what an attacker reaches
  # first, so a flaw there must not be a root shell on the host. The updater's
  # whole API is "update product <key>" against a fixed allowlist — it accepts no
  # path, repo, branch, image or command (see updater/backend/apps.py).
  #
  # Remove this service if you would rather run `sysiblectl <app> update` on the
  # host: Administration then simply shows the update state and the command,
  # which needs no socket at all.
  updater:
    build:
      context: ./updater
      args:
        SYSIBLE_REV: "${SYSIBLE_SLOP_REV:-}"   # see the header
    image: sysible-slop-updater
    container_name: sysible-slop-updater
    restart: unless-stopped
    environment:
      # See the note on the IdP: this pair, and only this pair, shares it.
      SYSIBLE_UPDATER_SECRET: ${SYSIBLE_UPDATER_SECRET:-}
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
      # Where install.sh cloned the products. Bind-mounted at the SAME path below
      # so a build context resolves identically inside the container and on the
      # host daemon.
      SYSIBLE_SRC_DIR: ${SYSIBLE_SRC_DIR:-/opt/sysible-src}
      SYSIBLE_SLOP_DIR: ${SYSIBLE_SLOP_DIR:-/opt/sysible-src/sysible-linux-operations-platform}
      # Whether this host runs the ONE-CHECKOUT layout: the apps built from
      # apps/ by this compose file, rather than from three checkouts of their
      # own. Written to .env by `install.sh --integrated`, so it survives every
      # later recreate.
      #
      # An explicit marker, not "apps/ exists". The directory arrives with a
      # git pull, and a pull must not change what Administration says is running
      # on a host that has not migrated -- three rows would start claiming to be
      # "built with the platform" while three standalone stacks went on serving
      # every request.
      SYSIBLE_INTEGRATED: ${SYSIBLE_INTEGRATED:-0}
    volumes:
      # Root-equivalent on the host. See the note above before adding anything here.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SYSIBLE_SRC_DIR:-/opt/sysible-src}:${SYSIBLE_SRC_DIR:-/opt/sysible-src}
      # SLOP's OWN checkout. install.sh clones the other products into SYSIBLE_SRC_DIR
      # (mounted above) but is itself run FROM this repo, wherever the operator cloned
      # it — so without this mount the updater could not see the checkout named by
      # SYSIBLE_SLOP_DIR, apps.checkout_dir() answered None, and Administration showed
      # SLOP as "not installed on this host": the platform could not update itself.
      # The source is `.` (this compose file's directory, so it is the real checkout
      # by construction); the target is the path it has on the HOST, because the
      # `docker compose` this service runs is resolved by the host daemon.
      - .:${SYSIBLE_SLOP_DIR:-/opt/sysible-src/sysible-linux-operations-platform}
      # The updater's own small state: the automatic-update schedule and what
      # the last run did. A VOLUME, not a file in the checkout -- writing to the
      # git tree would make it dirty, and a dirty checkout is the thing that
      # REFUSES updates. A scheduler that switches itself off the first time it
      # runs is worse than no scheduler.
      - updater-data:/data
    expose:
      - "8080"                     # internal only; never published

  # ---- the three apps, built from this tree (profile: integrated) ----------
  #
  # These are the SAME three products that used to be separate git checkouts on
  # the host, cloned by install.sh into /opt/sysible-src and brought up as three
  # more compose projects. Their source is in apps/ now and they are built here.
  #
  # Behind a PROFILE, so nothing below runs unless you ask for it:
  #
  #     docker compose --profile integrated up -d --build
  #
  # A plain `docker compose up -d` is byte-for-byte what it was, which is what
  # makes this safe to land on a host that is already running the three apps the
  # old way: their container names and ports are taken, and two stacks competing
  # for `sysible-controller` is not a thing to discover during an update. Migrate
  # deliberately -- docs/INTEGRATED.md says how -- not by pulling.
  #
  # What changes when you do:
  #
  #   * SYSIBLE_BASE_PATH is a LITERAL per service, below, instead of one
  #     variable read from whichever .env sat beside each app's compose file.
  #     It is a BUILD argument baked into the console's JS bundle, and all three
  #     apps read it from that one name -- one name, three different correct
  #     answers. Getting it wrong produces a console that serves its page and
  #     then asks for its assets at a path the gateway does not route: a blank
  #     screen with every container healthy. That has now happened twice.
  #
  #   * the consoles are not published at all. The gateway reaches them over
  #     this project's network by service name, so :8800 / :8810 / :8700 stop
  #     existing on the host -- there is no longer an address at which the
  #     gateway's security headers and the platform's login throttle can be
  #     skipped. The Controller's AGENT API is still published, because managed
  #     hosts across the network dial it.
  #
  #   * the Controller reaches Flashback and Baseline at flashback:8080 and
  #     baseline:8080, on this network, instead of going back out through
  #     host.docker.internal to ports published on the docker bridge.
  controller:
    profiles: ["integrated"]
    build:
      context: ./apps/controller
      args:
        # EMPTY, not "/" -- vite falls back to a relative base that is correct
        # both at the root and under /controller/. A "/" here re-bakes an
        # absolute /assets/... and the console comes up blank behind the gateway.
        SYSIBLE_BASE_PATH: ""
    image: sysible-controller:latest
    container_name: sysible-controller
    restart: unless-stopped
    ports:
      # NOT the console (8800). The gateway reaches it at controller:8800 on this
      # network; publishing it would put a door beside the front door.
      #
      # This one IS published and must stay published: it is the agent + CLI API
      # that managed hosts across the network dial. Binding it would strand the
      # fleet.
      - "9000:9000"
      # The self-service webserver portal, on the same number inside and out so
      # the address the console prints is the address that works.
      - "${SYSIBLE_PORTAL_PORT:-8090}:${SYSIBLE_PORTAL_PORT:-8090}"
    environment:
      SYSIBLE_CONTROLLER_HOSTNAMES: "${SYSIBLE_CONTROLLER_HOSTNAMES:-}"
      # The address AGENTS reach this controller at, baked into enrollment
      # bundles. Without it the controller advertises its docker-bridge IP and
      # the bundles strand the fleet on an unreachable address.
      SYSIBLE_CONTROLLER_ADDR: "${SYSIBLE_CONTROLLER_ADDR:-}"
      SYSIBLE_PORTAL_PORT: "${SYSIBLE_PORTAL_PORT:-8090}"
      # One stack, one trust boundary: the gateway asserts the identity and the
      # app trusts it only with the matching shared secret.
      SYSIBLE_WEBGUI_TRUST_SSO: "1"
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
      # Flashback and Baseline by SERVICE NAME on this network. Two services,
      # two tokens: Flashback holds what a host's configuration WAS, Baseline
      # declares what it must BECOME, and one token for both would make a
      # compromise of either a compromise of both.
      SYSIBLE_FLASHBACK_URL: "${SYSIBLE_FLASHBACK_URL:-http://flashback:8080}"
      SYSIBLE_FLASHBACK_AGENT_TOKEN: "${SYSIBLE_FLASHBACK_AGENT_TOKEN:-}"
      SYSIBLE_BASELINE_URL: "${SYSIBLE_BASELINE_URL:-http://baseline:8080}"
      SYSIBLE_BASELINE_AGENT_TOKEN: "${SYSIBLE_BASELINE_AGENT_TOKEN:-}"
      # Relay / bastion fallbacks; the console's own setting wins over these.
      SYSIBLE_RELAY_HOST: "${SYSIBLE_RELAY_HOST:-}"
      SYSIBLE_RELAY_USER: "${SYSIBLE_RELAY_USER:-}"
      SYSIBLE_RELAY_PORT: "${SYSIBLE_RELAY_PORT:-}"
      SYSIBLE_RELAY_IDENTITY: "${SYSIBLE_RELAY_IDENTITY:-}"
      SYSIBLE_RELAY_ALLOWLIST: "${SYSIBLE_RELAY_ALLOWLIST:-}"
      SYSIBLE_RELAY_OS: "${SYSIBLE_RELAY_OS:-}"
    extra_hosts:
      # A no-op where the name already resolves; kept so an operator can still
      # point any of the URLs above at something published on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      # The platform host's OWN /etc/hosts, read-only, so enrollment can turn a
      # host NAME with no address into one. A container's /etc/hosts is its
      # own; without this the names this machine resolves are unknown in here.
      # Lookups only -- the Controller never writes it.
      - /etc/hosts:/host/etc/hosts:ro
      - controller-data:/data

  slep:
    profiles: ["integrated"]
    build:
      context: ./apps/slep
      dockerfile: deploy/Dockerfile
      args:
        SYSIBLE_BASE_PATH: "/slep/"
    image: sysible-slep:latest
    container_name: sysible-slep
    restart: unless-stopped
    environment:
      SLEP_DATA_DIR: /data
      # TLS stays ON even on the internal network: the gateway dials it over
      # https (tls_insecure_skip_verify), and turning it off here would mean one
      # of the two hops in front of a root-capable automation console is plain.
      SLEP_TLS: "1"
      SLEP_TLS_HOSTS: ${SLEP_TLS_HOSTS:-}
      SLEP_TRUST_GATEWAY_AUTH: "1"
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
    expose:
      - "8810"
    volumes:
      - slep-data:/data

  connect:
    profiles: ["integrated"]
    build:
      context: ./apps/connect
      dockerfile: deploy/Dockerfile
      args:
        SYSIBLE_BASE_PATH: "/connect/"
    image: sysible-connect:latest
    container_name: sysible-connect
    restart: unless-stopped
    # HOST SHELL. "Local shell" means the HOST's shell, not a shell inside this
    # container: backend/terminals.py enters PID 1's namespaces with nsenter,
    # which needs PID 1 to BE the host's init and the capabilities to call
    # setns. Understand what this grants before copying it -- a superuser in the
    # browser terminal gets root on this host. That is what an operator means by
    # "local shell", and it is the same class of access the updater beside it
    # already holds through the Docker socket. SYSIBLE_CONNECT_HOST_SHELL=0
    # refuses it, and the terminal then SAYS it is the container rather than
    # looking like the host.
    pid: host
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      SYSIBLE_CONNECT_DATA: /data
      SYSIBLE_CONNECT_HOST_SHELL: "${SYSIBLE_CONNECT_HOST_SHELL:-1}"
      SYSIBLE_CONNECT_TLS: "1"
      SYSIBLE_CONNECT_TLS_HOSTS: ${SYSIBLE_CONNECT_TLS_HOSTS:-}
      SYSIBLE_CONNECT_TRUST_GATEWAY_AUTH: "1"
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
      # The Controller by SERVICE NAME. install.sh used to write this host's LAN
      # IP here, from one `ip route get` at install time, and persist it -- so a
      # host that came back on a different subnet kept pointing Connect at an
      # address nobody answers at. A service name on this network cannot go
      # stale. (Not localhost: Connect's SSRF guard blocks loopback, correctly.)
      SYSIBLE_CONNECT_CONTROLLER_URL: "${SYSIBLE_CONNECT_CONTROLLER_URL:-https://controller:9000}"
    expose:
      - "8700"
    volumes:
      - connect-data:/data

volumes:
  slop-idp-data:
  slop-caddy-data:
  slop-caddy-config:
  flashback-data:
  baseline-data:
  # The three vendored apps' data. Only created when the `integrated` profile
  # brings them up; a plain `up` never names them.
  #
  # NOTE for a migration: compose namespaces a volume by PROJECT, so these are
  # <this project>_controller-data and NOT the sysible-controller_sysible-data
  # the standalone stack wrote to. An integrated stack starts with empty data
  # unless the old volume is copied across first. docs/INTEGRATED.md has the
  # commands; doing it by surprise is how a fleet's enrollment database goes
  # missing.
  controller-data:
  slep-data:
  connect-data:
  # The automatic-update schedule and the record of what the last run did.
  updater-data:
