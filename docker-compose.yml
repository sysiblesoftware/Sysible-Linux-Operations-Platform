# Sysible Linux Operations Platform (SLOP) — the front door: gateway + IdP.
#
# This brings up the SLOP front door, which is TWO services:
#   * idp      — the identity provider: the one user store, the login page, and
#                where every account + password (for all three apps) is managed.
#   * gateway  — Caddy: terminates TLS, serves the portal, and enforces single
#                sign-on for the three apps via forward_auth to the IdP.
#
# The three apps — Controller, SLEP, Connect — run as their OWN container stacks
# (install them with `install-sysible`, or manage with `sysible_ctl`); the gateway
# proxies to them on the host ports they publish (8800 / 8810 / 8700). For SSO to
# reach INTO the apps, each app must run with the SAME SYSIBLE_SSO_SHARED_SECRET
# and its trust flag on — `install.sh` wires that automatically.
#
#   1. Bring up the apps + door together:   sudo ./install.sh
#      (or bring up the apps yourself, then `docker compose up -d --build` here).
#   2. Open  https://<this server's IP>/  and sign in. No domain to set, no DNS —
#      everything is ONE origin addressed by path (/controller /slep /connect) on
#      whatever IP this host has. (Accept the one-time self-signed cert warning.)
#
# See .env.example for the knobs and docs/SSO.md for the SSO contract.
services:
  idp:
    build: ./idp
    image: sysible-slop-idp
    container_name: sysible-slop-idp
    restart: unless-stopped
    environment:
      # No domain to configure — the IdP is same-origin behind the gateway and its
      # session cookie is always host-only. First-run bootstrap only: leave
      # SLOP_ADMIN_PASSWORD empty to have a random one generated and printed to the
      # idp logs once (docker logs sysible-slop-idp).
      SLOP_ADMIN_USER: ${SLOP_ADMIN_USER:-admin}
      SLOP_ADMIN_PASSWORD: ${SLOP_ADMIN_PASSWORD:-}
      # Administration -> Software updates talks to the updater sidecar over the
      # internal network, proving itself with the platform shared secret. The IdP
      # deliberately has NO Docker socket of its own.
      SLOP_UPDATER_UPSTREAM: ${SLOP_UPDATER_UPSTREAM:-updater:8080}
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
    volumes:
      - slop-idp-data:/data     # the user store (SQLite) — persist across restarts
    expose:
      - "8080"                  # internal only; the gateway is the sole front door

  gateway:
    image: caddy:2-alpine
    container_name: sysible-slop-gateway
    restart: unless-stopped
    depends_on:
      - idp
      - flashback
      - visualizer
    ports:
      - "80:80"     # HTTP → redirected to HTTPS by Caddy
      - "443:443"   # the single front door
    environment:
      # No domain — the gateway answers on 443 for whatever IP this host has and
      # mints its own self-signed cert (see gateway/Caddyfile).
      # The IdP the gateway asks "is this request signed in?" (forward_auth).
      SLOP_IDP_UPSTREAM: ${SLOP_IDP_UPSTREAM:-idp:8080}
      # The shared secret the gateway stamps on every proxied request so the apps
      # can prove it came through the gateway. MUST match each app's
      # SYSIBLE_SSO_SHARED_SECRET, or the apps fail closed and show their own login.
      # install.sh generates one into .env; set it yourself for a manual bring-up.
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
      # Where the apps actually listen (host:port). Defaults assume they publish on
      # this host; override if they run elsewhere or on a shared docker network.
      SLOP_CONTROLLER_UPSTREAM: ${SLOP_CONTROLLER_UPSTREAM:-host.docker.internal:8800}
      SLOP_SLEP_UPSTREAM: ${SLOP_SLEP_UPSTREAM:-host.docker.internal:8810}
      SLOP_CONNECT_UPSTREAM: ${SLOP_CONNECT_UPSTREAM:-host.docker.internal:8700}
      # Flashback (the config time machine) is baked into THIS stack (below), so the
      # gateway reaches it by service name on the internal network — no host port.
      SLOP_FLASHBACK_UPSTREAM: ${SLOP_FLASHBACK_UPSTREAM:-flashback:8080}
      # Visualizer (the activity & log console) is baked into THIS stack too.
      SLOP_VISUALIZER_UPSTREAM: ${SLOP_VISUALIZER_UPSTREAM:-visualizer:8080}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal:/srv/portal:ro
      - slop-caddy-data:/data      # issued certs + the internal CA (persist across restarts)
      - slop-caddy-config:/config
    extra_hosts:
      # Lets the container reach apps published on the host (Linux needs this).
      - "host.docker.internal:host-gateway"

  # Flashback — the config time machine — is a SLOP-native module (like the IdP), so
  # it's built and run here as part of the front door rather than as a separate
  # stack. It's expose-only (no host port): the gateway proxies to it at
  # flashback:8080 on this compose's internal network, and it trusts the gateway's
  # asserted identity via the same shared secret.
  flashback:
    build: ./flashback
    image: sysible-flashback
    container_name: sysible-flashback
    restart: unless-stopped
    environment:
      # Always behind the gateway here, so trust its asserted identity (guarded by
      # the shared secret) and never expose an own login.
      SYSIBLE_FLASHBACK_TRUST_GATEWAY_AUTH: "1"
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
      # Bearer token host agents present to the ingest/restore endpoints. Empty =
      # open (dev only); set it and hand the same value to the agents.
      SYSIBLE_FLASHBACK_AGENT_TOKEN: ${SYSIBLE_FLASHBACK_AGENT_TOKEN:-}
      SYSIBLE_FLASHBACK_KEEP: ${SYSIBLE_FLASHBACK_KEEP:-50}
    volumes:
      - flashback-data:/data       # the version store (SQLite) — persist across restarts
    expose:
      - "8080"                     # internal only; the gateway is the sole front door

  # Visualizer — the platform-wide activity & log console. Like the IdP and
  # Flashback it is a SLOP-native service in this stack: expose-only (no host
  # port), reached by the gateway at visualizer:8080. It is STATELESS and
  # READ-ONLY — no volume — because it stores nothing: every record it shows is
  # fetched live from the app that owns it, using the caller's own forwarded
  # identity so each app applies its own role rules.
  visualizer:
    build: ./visualizer
    image: sysible-visualizer
    container_name: sysible-visualizer
    restart: unless-stopped
    environment:
      SYSIBLE_VISUALIZER_TRUST_GATEWAY_AUTH: "1"
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
      # Where to read each app's activity/audit API. Same values the gateway uses.
      SLOP_CONTROLLER_UPSTREAM: ${SLOP_CONTROLLER_UPSTREAM:-host.docker.internal:8800}
      SLOP_SLEP_UPSTREAM: ${SLOP_SLEP_UPSTREAM:-host.docker.internal:8810}
      SLOP_CONNECT_UPSTREAM: ${SLOP_CONNECT_UPSTREAM:-host.docker.internal:8700}
      SLOP_FLASHBACK_UPSTREAM: ${SLOP_FLASHBACK_UPSTREAM:-flashback:8080}
    expose:
      - "8080"                     # internal only; the gateway is the sole front door
    extra_hosts:
      # Reach the three apps published on the host (Linux needs this).
      - "host.docker.internal:host-gateway"

  # The updater — SLOP Administration's "Update now" button. It is the ONLY
  # component given the host's Docker socket, which is root-equivalent on the
  # host. That is why it is a separate service rather than a capability of the
  # IdP: the IdP terminates browser sessions and is what an attacker reaches
  # first, so a flaw there must not be a root shell on the host. The updater's
  # whole API is "update product <key>" against a fixed allowlist — it accepts no
  # path, repo, branch, image or command (see updater/backend/apps.py).
  #
  # Remove this service if you would rather run `sysible_ctl <app> update` on the
  # host: Administration then simply shows the update state and the command,
  # which needs no socket at all.
  updater:
    build: ./updater
    image: sysible-slop-updater
    container_name: sysible-slop-updater
    restart: unless-stopped
    environment:
      SYSIBLE_SSO_SHARED_SECRET: ${SYSIBLE_SSO_SHARED_SECRET:?set SYSIBLE_SSO_SHARED_SECRET (run install.sh, or put it in .env) so SSO can reach the apps}
      # Where install.sh cloned the products. Bind-mounted at the SAME path below
      # so a build context resolves identically inside the container and on the
      # host daemon.
      SYSIBLE_SRC_DIR: ${SYSIBLE_SRC_DIR:-/opt/sysible-src}
      SYSIBLE_SLOP_DIR: ${SYSIBLE_SLOP_DIR:-/opt/sysible-src/sysible-linux-operations-platform}
    volumes:
      # Root-equivalent on the host. See the note above before adding anything here.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SYSIBLE_SRC_DIR:-/opt/sysible-src}:${SYSIBLE_SRC_DIR:-/opt/sysible-src}
    expose:
      - "8080"                     # internal only; never published

volumes:
  slop-idp-data:
  slop-caddy-data:
  slop-caddy-config:
  flashback-data:
